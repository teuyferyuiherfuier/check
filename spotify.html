<title>Drive · Spotify</title>
<style>
@property --c{syntax:'<color>';inherits:true;initial-value:#1b2a55}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#05070c;color:#f4f6fb;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{--c:#1b2a55;--pad:clamp(12px,calc(3.5*var(--u)),28px);transition:--c .9s ease}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:100%;height:100%;fill:currentColor}
svg.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bg{position:fixed;inset:0;
  background:radial-gradient(120% 150% at 12% 15%,var(--c),transparent 62%),
             radial-gradient(90% 110% at 100% 100%,color-mix(in srgb,var(--c) 45%,#05070c),transparent 70%),#05070c}

.app{position:relative;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);
  padding:var(--pt) var(--pr) var(--pb) var(--pl)}
.dock{width:76px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:var(--pad) 8px;background:rgba(0,0,0,.3);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:0 22px 22px 0}
.clock{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.dock .btns{display:flex;flex-direction:column;gap:10px}
.dock button{width:48px;height:48px;border-radius:14px;padding:12px;color:rgba(255,255,255,.7)}
.dock button:active{background:rgba(255,255,255,.14)}

.stage{display:flex;align-items:center;gap:clamp(14px,calc(3*var(--w)),48px);padding:var(--pad) clamp(14px,calc(3*var(--w)),44px);min-width:0;min-height:0}
.cw{position:relative;flex:none;height:min(calc(var(--H) - 2*var(--pad) - var(--pt) - var(--pb)),calc(38*var(--w)));max-height:440px;
  aspect-ratio:1;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.07);
  box-shadow:0 24px 60px rgba(0,0,0,.5);display:grid;place-items:center}
.cw img{width:100%;height:100%;object-fit:cover;display:block}
.cw .hint{position:absolute;left:10px;right:10px;bottom:10px;font-size:11px;line-height:1.3;color:rgba(255,255,255,.5);text-align:center;word-break:break-all}
.cw .note{width:34%;opacity:.35}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,calc(2*var(--u)),16px)}
.title{font-size:clamp(22px,calc(7*var(--u)),42px);font-weight:750;line-height:1.08;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.artist{font-size:clamp(16px,calc(4.8*var(--u)),25px);color:rgba(255,255,255,.82);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album{font-size:clamp(13px,calc(3.4*var(--u)),17px);color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.seek{margin-top:clamp(2px,calc(1.5*var(--u)),12px)}
.bar{padding:12px 0;cursor:pointer;touch-action:none}
.track{height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.fill{height:100%;width:0;background:#fff;border-radius:4px}
.times{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:480px;min-width:0}
.ctrls button{flex:none;aspect-ratio:1;width:clamp(38px,min(calc(12*var(--u)),calc(6.5*var(--w))),60px);height:auto;border-radius:50%;padding:clamp(9px,min(calc(3*var(--u)),calc(1.6*var(--w))),14px);
  display:grid;place-items:center;position:relative;transition:transform .12s,background .12s}
.ctrls button:active{transform:scale(.88);background:rgba(255,255,255,.14)}
.ctrls .big{width:clamp(54px,min(calc(19*var(--u)),calc(10*var(--w))),86px);height:auto;padding:clamp(14px,min(calc(5*var(--u)),calc(2.6*var(--w))),24px);background:#fff;color:#05070c}
.ctrls .big:active{background:#e4e7ee}
.ctrls .tog{color:rgba(255,255,255,.5)}
.ctrls .tog.on{color:color-mix(in srgb,var(--c) 30%,#fff)}
.ctrls .tog.on::after{content:"";position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.ctrls .tog.one::before{content:"1";position:absolute;top:8px;right:8px;font-size:10px;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(14px + var(--pb));transform:translate(-50%,20px);opacity:0;
  max-width:calc(80*var(--w));padding:10px 16px;border-radius:14px;background:rgba(20,22,30,.92);font-size:14px;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

.setup{position:fixed;inset:0;z-index:40;background:#05070c;overflow:auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:grid;place-items:center}
.card{width:min(640px,100%);display:flex;flex-direction:column;gap:12px}
.card h1{font-size:26px;letter-spacing:-.01em}
.card ol{padding-left:20px;display:flex;flex-direction:column;gap:8px;color:rgba(255,255,255,.8);font-size:15px;line-height:1.4}
.card code{display:inline-block;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:6px;font-size:13px;word-break:break-all;user-select:text;-webkit-user-select:text}
.card input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:16px;outline:0}
.card input:focus{border-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button,.mini{padding:12px 18px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:600}
.row .primary{background:#fff;color:#05070c}
.mini{padding:4px 10px;font-size:13px;margin-left:6px}
.warn{font-size:13px;color:#ffb36b;line-height:1.4}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.panel{flex:1;min-width:0;min-height:0;align-self:stretch;display:none;flex-direction:column;gap:8px}
body.q .panel{display:flex}body.q .info{display:none}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#qh{flex:1;font-weight:700;font-size:16px;white-space:nowrap}
.ph>button{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12);font-weight:650;font-size:14px}
#qs{flex:1 1 100%;order:5;min-width:0;padding:9px 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font-size:15px;outline:0}
#qs:focus{border-color:#fff}
#qlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.qr{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:12px;text-align:left;width:100%;flex:none}
.qr{cursor:pointer}
.qa{display:flex;gap:2px;flex:none}
.qa button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);font-size:15px}
.qa button:active{background:rgba(255,255,255,.28)}
.qbar{display:flex;gap:10px}
.qbar button{padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.14);font-weight:650}
.ver{font-size:10px;color:rgba(255,255,255,.3);text-align:right}
#qap{background:#fff;color:#05070c}
.qr:active{background:rgba(255,255,255,.12)}
.qr img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.08);flex:none}
.qt{flex:1;min-width:0;display:flex;flex-direction:column}
.qt b,.qt i{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.qt b{font-size:15px;font-weight:650}.qt i{font-size:13px;color:rgba(255,255,255,.55)}
.qr em{font-style:normal;font-size:14px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
body.q #qb{color:#fff;background:rgba(255,255,255,.16)}
#flip{display:none}
:root{--u:1vh;--w:1vw;--H:100dvh;--pt:env(safe-area-inset-top);--pr:env(safe-area-inset-right);--pb:env(safe-area-inset-bottom);--pl:env(safe-area-inset-left)}
@media (orientation:portrait){
  body.playing{--u:1vw;--w:1dvh;--H:100vw;--pt:env(safe-area-inset-right);--pr:env(safe-area-inset-bottom);--pb:env(safe-area-inset-left);--pl:env(safe-area-inset-top)}
  body.playing.flip{--pt:env(safe-area-inset-left);--pr:env(safe-area-inset-top);--pb:env(safe-area-inset-right);--pl:env(safe-area-inset-bottom)}
  body.playing .app{position:fixed;left:0;top:0;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
  body.playing.flip .app{transform:translateY(100dvh) rotate(-90deg)}
  body.playing #flip{display:block}
}
</style>

<body>
<div class="bg"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>

  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3c4 0 5 10 9 10h5M3 17h3c1.4 0 2.5-1 3.4-2.5M13.5 9C14.3 7.9 15.4 7 16.8 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 014-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 01-4 4H4"/></symbol>

<main class="app">
  <aside class="dock">
    <div class="clock" id="clock">--:--</div>

      <button id="qb" aria-label="File d’attente"><svg class="s"><use href="#i-list"/></svg></button>

        <button id="next" aria-label="Titre suivant"><svg><use href="#i-next"/></svg></button>

      <div class="ph"><span id="qh">File d’attente</span><button id="qe" hidden>Modifier</button><button id="qx" aria-label="Fermer la file">✕</button><input id="qs" placeholder="Chercher un titre à ajouter…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>

<section class="setup" id="setup" hidden>
  <div class="card">
    <h1>Connecte ton Spotify</h1>
    <ol>
      <li>Crée une app sur <b>developer.spotify.com/dashboard</b> (cocher « Web API »).</li>
      <li>Dans ses réglages, ajoute cette Redirect URI : <code id="ru"></code><button class="mini" id="copy">Copier</button></li>
      <li>Colle son Client ID ci-dessous.</li>
    </ol>
    <input id="cid" placeholder="Client ID" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row"><button class="primary" id="go">Se connecter à Spotify</button><button id="demo">Voir la démo</button></div>
    <p class="warn" id="warn" hidden></p>
  </div>
</section>

<script>
const $=s=>document.querySelector(s);
const mem={};
const get=k=>{try{return localStorage.getItem(k)}catch{return mem[k]}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch{mem[k]=v}};
const del=k=>{try{localStorage.removeItem(k)}catch{delete mem[k]}};
const SCOPES='user-read-playback-state user-modify-playback-state user-read-currently-playing';
const REDIRECT=location.origin+location.pathname;
const HOSTED=/^https?:$/.test(location.protocol)&&location.origin!=='null';
const P={dur:0,pos:0,playing:false,shuffle:false,repeat:'off'};
let lastUri='',demo=false,stamp=Date.now(),busy=false,curUrl='',timers=[];

/* ---------- Auth (PKCE) ---------- */
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return b64u(a).slice(0,n)};

async function login(){
  if(!HOSTED)return toast('Héberge d’abord la page, puis ouvre son adresse.');
  const id=$('#cid').value.trim();
  if(!id)return toast('Colle ton Client ID d’abord.');
  set('cid',id);set('sv','2');
  const ver=rand(64);set('ver',ver);
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({
    client_id:id,response_type:'code',redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:'S256',code_challenge:ch});
}
async function tokenReq(body){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:get('cid'),...body})});
  if(!r.ok)throw new Error('token');
  const j=await r.json();
  set('at',j.access_token);set('exp',String(Date.now()+j.expires_in*1000-60000));
  if(j.refresh_token)set('rt',j.refresh_token);
}
async function token(){
  if(Date.now()>+get('exp')){
    try{await tokenReq({grant_type:'refresh_token',refresh_token:get('rt')})}catch{throw{auth:true}}
  }
  return get('at');
}
function logout(){
  ['at','rt','exp'].forEach(del);stop();demo=false;showSetup();
}

/* ---------- API ---------- */
async function api(method,path,body){
  if(demo)return mock(method,path,body);
  const t=await token();
  const r=await fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+t,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401)throw{auth:true};
  if(!r.ok&&r.status!==204&&r.status!==202)throw{status:r.status};
  if(method!=='GET'||r.status===204)return null;
  return r.json();
}

/* ---------- Démo ---------- */
const TR=[['Nuit blanche','Lune Électrique','Sous les néons',212000,'#ff6a3d','#5b1fa8'],
          ['Autoroute','Delta Nine','Heure bleue',187000,'#18c6b4','#10305f'],
          ['Cap sud','Marée','Horizons',241000,'#f7c948','#d6336c']];
const M={i:0,playing:true,pos:42000,t:Date.now(),shuffle:false,repeat:'off',img:{}};
function art(a,b){
  const k=document.createElement('canvas');k.width=k.height=400;const x=k.getContext('2d');
  const g=x.createLinearGradient(0,0,400,400);g.addColorStop(0,a);g.addColorStop(1,b);
  x.fillStyle=g;x.fillRect(0,0,400,400);
  x.fillStyle='rgba(255,255,255,.2)';x.beginPath();x.arc(270,140,110,0,7);x.fill();
  x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.arc(110,310,150,0,7);x.fill();
  return k.toDataURL();
}
function qi(i){const T=TR[i];M.img[i]=M.img[i]||art(T[4],T[5]);return{name:T[0],artists:[{name:T[1]}],album:{name:T[2],images:[{url:M.img[i]}]},duration_ms:T[3],uri:'demo:'+i}}
function mock(method,path,body){
  const now=Date.now();if(M.playing)M.pos+=now-M.t;M.t=now;
  const q=new URLSearchParams(path.split('?')[1]||'');
  if(path.startsWith('/me/player/queue'))return method==='GET'?{queue:(M.q||[1,2,3,4].map(k=>(M.i+k)%TR.length)).map(i=>qi(i))}:null;
  if(path.startsWith('/search')){const v=(q.get('q')||'').toLowerCase();return{tracks:{items:TR.map((_,i)=>qi(i)).filter(x=>(x.name+x.artists[0].name).toLowerCase().includes(v))}}}
  if(method!=='GET'){
    if(path.startsWith('/me/player/pause'))M.playing=false;
    else if(path.startsWith('/me/player/play')){M.playing=true;if(body&&body.uris)M.q=body.uris.slice(1).map(u=>+u.split(':')[1])}
    else if(path.includes('/next')){M.i=M.q&&M.q.length?M.q.shift():(M.i+1)%TR.length;M.pos=0}
    else if(path.includes('/previous')){if(M.pos>3000)M.pos=0;else{M.i=(M.i+TR.length-1)%TR.length;M.pos=0}}
    else if(path.includes('/seek'))M.pos=+q.get('position_ms');
    else if(path.includes('/shuffle'))M.shuffle=q.get('state')==='true';
    else if(path.includes('/repeat'))M.repeat=q.get('state');
    return null;
  }
  if(M.pos>=TR[M.i][3]){M.i=(M.i+1)%TR.length;M.pos=0}
  const T=TR[M.i];M.img[M.i]=M.img[M.i]||art(T[4],T[5]);
  return{is_playing:M.playing,progress_ms:M.pos,shuffle_state:M.shuffle,repeat_state:M.repeat,
    item:{name:T[0],artists:[{name:T[1]}],album:{name:T[2],images:[{url:M.img[M.i]}]},duration_ms:T[3],uri:'demo:'+M.i}};
}

/* ---------- Rendu ---------- */
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const curPos=()=>P.playing?Math.min(P.dur,P.pos+Date.now()-stamp):P.pos;

const slug=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,'et').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function offlineAlts(it){
  const ar=it.artists&&it.artists[0]?it.artists[0].name:'',al=it.album?it.album.name:'',t=it.name||'';
  const names=[slug(ar)&&slug(t)&&slug(ar)+'-'+slug(t),slug(t),ar&&t&&ar+' - '+t,t,slug(al),'default'].filter(Boolean);
  const out=[];
  [...new Set(names)].forEach(n=>['jpg','png','webp','jpeg'].forEach(e=>out.push('offline/'+encodeURIComponent(n).replace(/%2F/g,'-')+'.'+e)));
  return out;
}
function setCover(key,url,alts){
  if(key===curUrl)return;curUrl=key;
  const c=$('#cover'),h=$('#hint');h.hidden=true;
  const none=()=>{if(key!==curUrl)return;c.hidden=true;$('#note').hidden=false;document.body.style.setProperty('--c','#1b2a55');
    if(alts&&alts.length){h.textContent=decodeURIComponent(alts[0]);h.hidden=false}};
  if(!key)return none();
  const show=u=>{if(key!==curUrl)return;c.src=u;c.hidden=false;$('#note').hidden=true};
  const list=[url,...(alts||[])].filter(Boolean);
  (function next(i){
    if(key!==curUrl)return;
    if(i>=list.length)return none();
    const im=new Image();im.crossOrigin='anonymous';
    const sp=!!url&&i===0;
    im.onload=()=>{show(list[i]);tint(im)};
    im.onerror=()=>sp?show(url):next(i+1);
    im.src=list[i];
  })(0);
}
function tint(im){
  try{
    const k=document.createElement('canvas');k.width=k.height=8;
    const x=k.getContext('2d');x.drawImage(im,0,0,8,8);
    const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++}
    r/=n;g/=n;b/=n;const f=115/(Math.max(r,g,b)||1);
    document.body.style.setProperty('--c',`rgb(${r*f|0},${g*f|0},${b*f|0})`);
  }catch{}
}
function paint(){
  $('#play use').setAttribute('href',P.playing?'#i-pause':'#i-play');
  $('#shuf').classList.toggle('on',P.shuffle);
  $('#rep').classList.toggle('on',P.repeat!=='off');
  $('#rep').classList.toggle('one',P.repeat==='track');
}
function render(S){
  const it=S&&S.item;curItem=it||null;
  if(!it){
    $('#t').textContent='Rien en lecture';
    $('#a').textContent='Lance un titre dans Spotify, il s’affichera ici.';
    $('#al').textContent='';setCover('','');
    Object.assign(P,{dur:0,pos:0,playing:false});stamp=Date.now();paint();return;
  }
  const imgs=(it.album||it).images||[];
  $('#t').textContent=it.name;
  $('#a').textContent=it.artists?it.artists.map(x=>x.name).join(', '):(it.show?it.show.name:'');
  $('#al').textContent=it.album?it.album.name:'';
  const url=(imgs[0]||{}).url||'';
  setCover(url||'off|'+(it.uri||it.name),url,url?[]:offlineAlts(it));
  Object.assign(P,{dur:it.duration_ms,pos:S.progress_ms||0,playing:!!S.is_playing,shuffle:!!S.shuffle_state,repeat:S.repeat_state||'off'});
  stamp=Date.now();paint();
  if(it.uri!==lastUri){lastUri=it.uri;loadQueue()}
}
function tick(){
  const pos=curPos();
  $('#fill').style.width=(P.dur?pos/P.dur*100:0)+'%';
  $('#p').textContent=fmt(pos);$('#d').textContent=fmt(P.dur);
}
function clock(){$('#clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}

let tt;function toast(m){
  if(!document.body.classList.contains('playing')){const w=$('#warn');w.hidden=false;w.textContent=m;return}
  const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}

/* ---------- File d'attente ---------- */
let QL=[],qdirty=false,curItem=null;
function ib(txt,label,fn){const b=document.createElement('button');b.textContent=txt;b.setAttribute('aria-label',label);b.onclick=e=>{e.stopPropagation();fn()};return b}
function row(it,onTap,tail){
  const imgs=(it.album&&it.album.images)||it.images||[],u=(imgs[imgs.length-1]||{}).url;
  const d=document.createElement('div'),im=document.createElement('img'),t=document.createElement('span'),b=document.createElement('b'),i=document.createElement('i');
  d.className='qr';d.setAttribute('role','button');im.alt='';if(u)im.src=u;t.className='qt';
  b.textContent=it.name;i.textContent=(it.artists||[]).map(x=>x.name).join(', ');t.append(b,i);d.append(im,t);
  if(tail&&typeof tail==='object')d.append(tail);else{const e=document.createElement('em');e.textContent=tail||fmt(it.duration_ms);d.append(e)}
  d.onclick=onTap;return d;
}
function drawQ(){
  const L=$('#qlist'),y=L.scrollTop,ed=document.body.classList.contains('qe');
  L.replaceChildren();
  $('#qh').textContent=QL.length?'File d’attente · '+QL.length:'File d’attente vide';
  QL.forEach((it,k)=>{
    let tail;
    if(ed){tail=document.createElement('span');tail.className='qa';
      tail.append(ib('⤒','Jouer ensuite',()=>mv(k,0)),ib('↑','Monter',()=>mv(k,k-1)),ib('↓','Descendre',()=>mv(k,k+1)),ib('✕','Retirer',()=>rm(k)))}
    L.append(row(it,ed?()=>{}:()=>jump(k,it),tail));
  });
  L.scrollTop=y;$('#qbar').hidden=!qdirty;
}
function mv(k,to){if(to<0||to>=QL.length||to===k)return;QL.splice(to,0,QL.splice(k,1)[0]);qdirty=true;drawQ()}
function rm(k){QL.splice(k,1);qdirty=true;drawQ()}
async function loadQueue(){
  if(!document.body.classList.contains('q')||qdirty||$('#qs').value.trim())return;
  try{const r=await api('GET','/me/player/queue');QL=((r&&r.queue)||[]).slice(0,50);drawQ()}
  catch(e){toast(e.status===403?'Reconnecte-toi pour activer la file d’attente.':'File d’attente indisponible.')}
}
async function applyQ(){
  if(!curItem||!curItem.uri||curItem.is_local||QL.some(x=>!x.uri||x.is_local))return toast('Impossible avec des titres locaux : rien n’a été modifié.');
  if(!confirm('Remplacer la lecture par cette liste ? La suite de ta playlist ou de ton album sera perdue.'))return;
  const list=QL;
  busy=true;
  try{
    await api('PUT','/me/player/play',{uris:[curItem.uri,...list.map(x=>x.uri)],position_ms:Math.round(curPos())});
    qdirty=false;toast('Ordre appliqué');
  }catch(e){toast(e.status===404?'Aucun appareil actif.':e.status===403?'Spotify Premium nécessaire.':'Application impossible.')}
  busy=false;setTimeout(()=>{poll();loadQueue()},600);
}
async function jump(k,it){
  busy=true;toast('Lecture : '+it.name);
  try{for(let n=0;n<=k;n++){await api('POST','/me/player/next');await new Promise(r=>setTimeout(r,250))}}
  catch{toast('Saut impossible.')}
  busy=false;setTimeout(()=>{poll();loadQueue()},400);
}
async function search(){
  const v=$('#qs').value.trim();
  if(!v){qdirty?drawQ():loadQueue();return}
  try{
    const r=await api('GET','/search?type=track&limit=10&q='+encodeURIComponent(v)),L=$('#qlist');
    L.replaceChildren();$('#qh').textContent='Touche pour ajouter';
    ((r&&r.tracks&&r.tracks.items)||[]).forEach(it=>L.append(row(it,async()=>{
      try{await api('POST','/me/player/queue?uri='+encodeURIComponent(it.uri));toast('Ajouté : '+it.name)}
      catch(e){toast(e.status===404?'Aucun appareil actif.':'Ajout impossible.')}
    },'+')));
  }catch{toast('Recherche impossible.')}
}
let st;$('#qs').oninput=()=>{clearTimeout(st);st=setTimeout(search,400)};
const closeQ=()=>{document.body.classList.remove('q','qe');$('#qe').textContent='Modifier'};
$('#qb').onclick=()=>{if(document.body.classList.contains('q'))return closeQ();document.body.classList.add('q');$('#qs').value='';qdirty?drawQ():loadQueue()};
$('#qx').onclick=closeQ;
$('#qe').onclick=()=>{
  if(!document.body.classList.contains('qe')&&(QL.some(x=>x.is_local||!x.uri)||(curItem&&curItem.is_local))){toast('Spotify ne permet pas de réordonner des titres locaux.');return}
  const on=document.body.classList.toggle('qe');$('#qe').textContent=on?'Terminé':'Modifier';drawQ()};
$('#qap').onclick=applyQ;
$('#qca').onclick=()=>{qdirty=false;loadQueue()};

/* ---------- Boucle ---------- */
async function poll(){
  if(busy)return;
  try{render(await api('GET','/me/player?additional_types=episode'))}
  catch(e){if(e.auth)logout()}
}
function start(){
  document.body.classList.add('playing');$('#setup').hidden=true;stop();poll();wake();
  timers=[setInterval(poll,3000),setInterval(tick,250)];
}
function stop(){timers.forEach(clearInterval);timers=[]}
function showSetup(){
  document.body.classList.remove('playing','q');$('#setup').hidden=false;$('#cid').value=get('cid')||'';
  const w=$('#warn');
  $('#ru').textContent=HOSTED?REDIRECT:'(visible une fois la page hébergée)';
  if(!HOSTED){w.hidden=false;w.textContent='Cette page est ouverte en aperçu ou depuis un fichier : Spotify ne peut pas t’y reconnecter. Héberge-la en HTTPS (GitHub Pages, Netlify…) puis ouvre son adresse. La démo marche partout.'}
  else if(location.hostname==='localhost'){w.hidden=false;w.textContent='Spotify n’accepte plus « localhost » : ouvre la page via http://127.0.0.1 à la place.'}
}

/* ---------- Actions ---------- */
async function act(method,path){
  busy=true;
  try{await api(method,path)}
  catch(e){
    toast(e.auth?'Session expirée, reconnecte-toi.':e.status===404?'Aucun appareil actif : ouvre Spotify et lance un titre.':
      e.status===403?'Spotify Premium est nécessaire pour contrôler la lecture.':'Action impossible pour le moment.');
  }
  busy=false;setTimeout(poll,350);
}
$('#play').onclick=()=>{P.pos=curPos();stamp=Date.now();P.playing=!P.playing;paint();act('PUT',P.playing?'/me/player/play':'/me/player/pause')};
$('#next').onclick=()=>act('POST','/me/player/next');
$('#prev').onclick=()=>act('POST','/me/player/previous');
$('#shuf').onclick=()=>{P.shuffle=!P.shuffle;paint();act('PUT','/me/player/shuffle?state='+P.shuffle)};
$('#rep').onclick=()=>{const o=['off','context','track'];P.repeat=o[(o.indexOf(P.repeat)+1)%3];paint();act('PUT','/me/player/repeat?state='+P.repeat)};
$('#bar').addEventListener('pointerdown',e=>{
  if(!P.dur)return;
  const r=$('#bar').getBoundingClientRect();
  const cl=document.body.classList,rot=matchMedia('(orientation:portrait)').matches&&cl.contains('playing');
  const f=rot?(cl.contains('flip')?(r.bottom-e.clientY)/r.height:(e.clientY-r.top)/r.height):(e.clientX-r.left)/r.width;
  const pos=Math.round(Math.min(1,Math.max(0,f))*P.dur);
  P.pos=pos;stamp=Date.now();tick();act('PUT','/me/player/seek?position_ms='+pos);
});
$('#out').onclick=logout;
if(get('flip')==='1')document.body.classList.add('flip');
$('#flip').onclick=()=>{set('flip',document.body.classList.toggle('flip')?'1':'0')};
$('#full').onclick=()=>{const d=document;d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen()};
if(!document.documentElement.requestFullscreen)$('#full').hidden=true;
$('#go').onclick=login;
$('#demo').onclick=()=>{demo=true;start()};
$('#copy').onclick=()=>{if(!HOSTED)return toast('Pas encore d’adresse à copier.');navigator.clipboard&&navigator.clipboard.writeText(REDIRECT).then(()=>toast('Redirect URI copiée'))};

async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch{}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timers.length)wake()});

/* ---------- Démarrage ---------- */
(async function init(){
  clock();setInterval(clock,15000);
  const q=new URLSearchParams(location.search);
  if(q.get('code')){
    history.replaceState({},'',REDIRECT);
    try{await tokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIRECT,code_verifier:get('ver')})}
    catch{toast('Connexion refusée, réessaie.')}
  }else if(q.get('error')){history.replaceState({},'',REDIRECT);toast('Connexion annulée.')}
  if(get('rt')&&get('sv')!=='2')toast('Reconnecte-toi une fois pour activer la file d’attente.');
  get('rt')&&get('sv')==='2'?start():showSetup();
})();
</script>
